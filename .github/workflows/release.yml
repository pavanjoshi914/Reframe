name: Build Reframe

# Manual trigger only — open the Actions tab, pick this workflow, click
# "Run workflow". ~10–15 min later the per-OS installers are attached to the
# run as downloadable artifacts. Download them, then create the GitHub release
# by hand and upload the files. (Same flow openscreen uses.)
on:
  workflow_dispatch: {}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 headers for libuiohook
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxtst-dev libxt-dev libxinerama-dev \
            libxkbcommon-dev libxkbfile-dev libxrandr-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Package Linux app
        run: npm run package:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  # The Flatpak is the one Linux package where every feature works on every
  # distro with nothing installed by hand (the GNOME runtime carries GStreamer +
  # PyGObject). electron-builder can't produce it, so build it from the same
  # manifest with flatpak-builder. Kept as its own job so a Flatpak failure never
  # blocks the .deb / AppImage.
  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 headers for libuiohook
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxtst-dev libxt-dev libxinerama-dev \
            libxkbcommon-dev libxkbfile-dev libxrandr-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Build the unpacked Linux app (the Flatpak's input)
        run: |
          npm run build
          npx electron-builder --linux dir
      - name: Build the Flatpak bundle
        run: |
          # elfutils provides eu-strip, which flatpak-builder uses to strip
          # debug symbols; without it the build fails at the strip step.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          # --install-deps-from pulls the runtime/SDK/Electron base named in the
          # manifest (org.gnome.Platform//50, org.gnome.Sdk//50, the Electron
          # BaseApp) from Flathub; --user avoids needing root/polkit.
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=fp-repo fp-build flatpak/app.reframe.desktop.yml
          VERSION=$(node -p "require('./package.json').version")
          flatpak build-bundle fp-repo "release/Reframe-${VERSION}-x86_64.flatpak" \
            app.reframe.desktop \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: release/*.flatpak
          if-no-files-found: error
          retention-days: 30

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Package Windows app
        run: npm run package:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Package macOS app (${{ matrix.arch }})
        run: npm run package:mac -- --${{ matrix.arch }} --publish never
        env:
          # No Apple Developer cert wired up — build unsigned. The .dmg works
          # but macOS Gatekeeper flags it as "unidentified developer"; users
          # right-click → Open on first launch to bypass.
          #
          # To ship a signed + notarized .dmg later (like openscreen does):
          #   1. Get an Apple Developer membership ($99/yr).
          #   2. Add repo secrets: MAC_CERTIFICATE_P12, MAC_CERTIFICATE_PASSWORD,
          #      APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD.
          #   3. Import the cert into a temp keychain before packaging, set
          #      CSC_LINK / CSC_KEY_PASSWORD, and add an electron-builder
          #      `afterSign` notarize hook (or run `xcrun notarytool` here).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30
